<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://web.poecdn.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';">
    <title>Simplex - Live Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
    <link rel="stylesheet" href="theme.css" />
</head>
  <body>
    <div id="overlay" class="overlay hidden">
      <div class="header drag">
        <div class="title" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <img src="../assets/app-icon-256.png" alt="Simplex" class="app-icon" style="width: 32px; height: 32px;">
            <div style="display: flex; flex-direction: column;">
              <div style="font-size: 14px; font-weight: 600; color: #e8e8e8;">Simplex</div>
              <div style="font-size: 11px; color: #999;">Overlay</div>
            </div>
          </div>
          <div class="controls no-drag">
            <button id="dismissAllBtn" class="btn-header-dismiss" title="Dismiss all">x</button>
          </div>
        </div>
      </div>
      
      <!-- Live Trades Section -->
      <div id="liveTradesSection" class="section-header hidden">
        <div class="section-title">Live Trades (<span id="liveTradesCount">0</span>)</div>
      </div>
      <div id="liveTradesItems" class="items"></div>

      <!-- Whispers Section -->
      <div id="whispersSection" class="section-header hidden">
        <div class="section-title">Whispers (<span id="whispersCount">0</span>)</div>
      </div>
      <div id="whispersItems" class="items"></div>
    </div>

    <audio id="soundNotification" preload="auto">
      <source src="../assets/sound.wav" type="audio/wav">
    </audio>

    <script src="overlay.js"></script>
  </body>
  </html>
