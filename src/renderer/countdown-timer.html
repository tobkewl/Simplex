<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <title>Run Timer</title>
    <link rel="stylesheet" href="countdown-timer.css" />
    <link rel="stylesheet" href="theme.css" />
</head>
  <body>
    <div class="countdown-dock-content" id="dockContent">
      <div class="countdown-dock-timer" id="countdownTimer">60:00</div>
      <div class="countdown-dock-profit" id="countdownProfit">-</div>
      <div class="countdown-dock-controls">
        <button id="pauseRunBtn" class="dock-btn" title="Pause/Resume">⏸</button>
        <button id="stopRunBtn" class="dock-btn dock-btn-danger" title="Stop">⏹</button>
      </div>
    </div>

    <script src="countdown-timer.js"></script>
  </body>
</html>
